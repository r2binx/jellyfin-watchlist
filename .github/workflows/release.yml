name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node --test tests/
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Resolve version from tag (v1.2.3 -> 1.2.3.0)
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in *.*.*.*) ;; *) V="$V.0" ;; esac
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - run: dotnet build Jellyfin.Plugin.Watchlist/Jellyfin.Plugin.Watchlist.csproj -c Release -p:Version=$VERSION -p:AssemblyVersion=$VERSION -p:FileVersion=$VERSION
      - name: Package
        run: |
          ZIP="Jellyfin.Plugin.Watchlist_$VERSION.zip"
          (cd Jellyfin.Plugin.Watchlist/bin/Release/net10.0 && zip -j "$GITHUB_WORKSPACE/$ZIP" Jellyfin.Plugin.Watchlist.dll)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update manifest on main
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git fetch origin main
          git checkout main
          node scripts/update-manifest.mjs "$VERSION" "$ZIP" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}" "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "publish $VERSION to manifest"
          git push origin main
